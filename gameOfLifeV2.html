<!DOCTYPE html>
<!-- Game of Life with a finite board. Typed-array buffers separate the current generation from the next; live cells share instanced geometry. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game of Life V2</title>
    <link rel="stylesheet" href="/Lib/Bootstrap4.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="./gameOfLifeV2.css?v=2">
    <link rel="stylesheet" href="/NavBar.css">
    <script type="importmap">
        { "imports": { "three": "../../Lib/Three/Three.js" } }
    </script>
    <link rel="stylesheet" href="/Theme.css?v=1">
    <link rel="canonical" href="https://louisdubeux.com/Projects/gameOfLifeV2/gameOfLifeV2.html">
    <meta name="description" content="Explore the Three.js scene for the next version of Game of Life.">
</head>
<body>
    <!-- Shared navigation is populated by /NavBar.js. -->
    <div id="nav-placeholder"></div>
    <main id="scene-container" aria-label="Game of Life V2 scene">
        <div class="scene-info">
            <h1>Game of Life V2</h1>
            <p>Conway’s cellular automaton in Three.js</p>
            <small>Loading simulation…</small>
        </div>
        <p id="scene-error" role="alert" hidden></p>
    </main>
    
    <!-- Load the project entry module after its controls and view containers exist. -->
    <script type="module" src="./gameOfLifeV2.js"></script>
    <script src="/NavBar.js" defer></script>
</body>
</html>
